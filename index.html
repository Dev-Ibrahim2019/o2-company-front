<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RestoMaster POS</title>
    <meta name="theme-color" content="#0B0F12" />
    <script>
      (() => {
        const storedTheme = localStorage.getItem("o2-theme");
        const theme =
          storedTheme === "light" || storedTheme === "dark"
            ? storedTheme
            : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Cairo", "Tajawal", "Arial", "sans-serif"],
            },
            colors: {
              brand: {
                DEFAULT: "#A30000",
                dark: "#7A0000",
                soft: "rgba(163, 0, 0, 0.12)",
              },
              slate: {
                950: "#0B0F12",
                900: "#161B22",
                800: "#1D242D",
                700: "#30363D",
                600: "#656D76",
                500: "#8B949E",
                400: "#8B949E",
                300: "#C9D1D9",
                200: "#F0F6FC",
                100: "#F0F6FC",
              },
              red: {
                950: "#350000",
                900: "#5C0000",
                800: "#7A0000",
                700: "#7A0000",
                600: "#A30000",
                500: "#A30000",
                400: "#FF6B6B",
              },
            },
            boxShadow: {
              card: "0 18px 45px rgba(0, 0, 0, 0.28)",
            },
          },
        },
      };
    </script>
    <script type="importmap">
      {
        "imports": {
          "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
          "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
          "react/": "https://esm.sh/react@^19.2.3/",
          "react": "https://esm.sh/react@^19.2.3",
          "@google/genai": "https://esm.sh/@google/genai@^1.37.0"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
